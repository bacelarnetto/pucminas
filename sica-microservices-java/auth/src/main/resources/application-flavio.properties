server.port=${port:8083}

eureka.instance.prefer-ip-address=true
eureka.client.service-url.defaultZone=http://192.168.15.16:8081/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true


jwt.config.type=signed

#estudar essa parte melhor
default.sender=emailparatestejbn@gmail.com
default.recipient=emailparatestejbn@gmail.com

spring.application.name=auth


spring.datasource.initialization-mode=always
spring.datasource.platform=postgres
spring.datasource.url=jdbc:postgresql://192.168.15.16:5434/sica_auth
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=root
spring.datasource.password=12345

spring.jpa.database=POSTGRESQL
spring.jpa.show-sql=true
spring.jpa.generate-ddl=true
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.format_sql=true

#configuracao de e-mail
spring.mail.host=smtp.gmail.com
spring.mail.username=emailparatestejbn
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth = true
spring.mail.properties.mail.smtp.socketFactory.port = 465
spring.mail.properties.mail.smtp.socketFactory.class = javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.socketFactory.fallback = false
spring.mail.properties.mail.smtp.starttls.enable = true
spring.mail.properties.mail.smtp.ssl.enable = true
