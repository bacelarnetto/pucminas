#    username: root
#    password: 12345

  jmx:
    enabled: false
  jpa:
    database: POSTGRESQL
    show-sql: true
    generate-ddl: true
  # Hibernate ddl auto (create, create-drop, validate, update)
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc.lob:
          non_contextual_creation: true

  datasource:
    initialization-mode: always
    platform: postgres
    url: jdbc:postgresql://192.168.56.101:5433/sica_barragem
    driver-class-name: org.postgresql.Driver
    username: root
    password: 12345 


jwt:
  config:
    type: signed
