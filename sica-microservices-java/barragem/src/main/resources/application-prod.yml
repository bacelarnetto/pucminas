server:
  port: 8082
  
eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://192.168.56.101:8081/eureka/
    register-with-eureka: true

spring:
  application:
    name: barragem

  rabbitmq:
    host: 192.168.56.101
    port: 5672
    username: guest
    password: guest

#  jpa:
#    show-sql: true
#    hibernate:
