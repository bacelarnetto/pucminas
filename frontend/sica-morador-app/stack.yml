version: '3.1'

services:

  sicamoradorapp:
    container_name: sicamoradorapp
    image: sicamoradorapp
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      TZ: America/Sao_Paulo
    ports:
        - "8001:80"
    labels:
        NAME: "sicamoradorapp"
    volumes:
      - .:/app
