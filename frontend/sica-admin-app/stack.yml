version: '3.1'

services:

  sicawebapp:
    container_name: sicawebapp
    image: sicawebapp
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      TZ: America/Sao_Paulo
    ports:
        - "8000:80"
    labels:
        NAME: "sicawebapp"
    volumes:
      - .:/app
   